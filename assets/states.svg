<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Chalkably button states</title>
  <desc id="desc">Six chalk button examples labeled idle, loading, error, success, neutral, and danger.</desc>
  <defs>
    <filter id="chalk" x="-8%" y="-20%" width="116%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="4" result="dust" />
      <feDisplacementMap in="SourceGraphic" in2="dust" scale="1.5" />
      <feGaussianBlur stdDeviation=".15" />
    </filter>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="27" r=".8" fill="#f3eee2" opacity=".08" />
      <circle cx="79" cy="68" r=".6" fill="#f3eee2" opacity=".07" />
      <path d="M45 9l7-.5M8 78l5 1" stroke="#f3eee2" opacity=".05" />
    </pattern>
    <style>
      .line { fill: none; stroke: #f3eee2; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .copy { fill: #f3eee2; font: 600 16px system-ui, sans-serif; }
      .label { fill: #8e9796; font: 600 10px ui-monospace, monospace; letter-spacing: 1.1px; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#17232d" />
  <rect width="1200" height="260" rx="24" fill="url(#grain)" />
  <g filter="url(#chalk)">
    <text x="56" y="47" class="label">BUTTON STATES / CHALKABLY</text>
    <g transform="translate(56 76)">
      <path d="M1 2Q1-3 7-2H162Q168-2 168 3V53Q168 58 162 58H7Q1 58 1 52Z" fill="#f3eee2" stroke="#f3eee2" stroke-width="2.5" />
      <text x="38" y="34" fill="#17232d" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Save</text>
      <text x="54" y="84" class="label">IDLE</text>
    </g>
    <g transform="translate(252 76)">
      <path d="M1 3Q0-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" opacity=".56" />
      <text x="25" y="34" class="copy">Working…</text>
      <text x="49" y="84" class="label" fill="#f3d38b">LOADING</text>
    </g>
    <g transform="translate(448 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q168 58 162 58H7Q1 57 1 52Z" class="line" stroke="#ff9a8f" />
      <text x="47" y="34" class="copy" fill="#ff9a8f">Retry</text>
      <text x="62" y="84" class="label" fill="#ff9a8f">ERROR</text>
    </g>
    <g transform="translate(644 76)">
      <path d="M1 2Q1-3 7-2H162Q168-2 168 3V53Q168 58 162 58H7Q1 58 1 52Z" fill="#f3eee2" stroke="#f3eee2" stroke-width="2.5" />
      <text x="43" y="34" fill="#17232d" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Done</text>
      <text x="51" y="84" class="label" fill="#91ddb4">SUCCESS</text>
    </g>
    <g transform="translate(840 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" opacity=".48" />
      <text x="34" y="34" class="copy" opacity=".78">Preview</text>
      <text x="55" y="84" class="label">NEUTRAL</text>
    </g>
    <g transform="translate(1036 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" stroke="#ff9a8f" />
      <text x="34" y="34" class="copy" fill="#ff9a8f">Delete</text>
      <text x="59" y="84" class="label" fill="#ff9a8f">DANGER</text>
    </g>
    <path d="M56 211Q205 207 355 211T650 211T945 211T1144 211" class="line" opacity=".27" />
    <text x="56" y="235" class="label">IDLE · LOADING · ERROR · SUCCESS · NEUTRAL · DANGER</text>
  </g>
</svg>
