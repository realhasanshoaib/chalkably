<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Chalkably Cosmic Chalk button states</title>
  <desc id="desc">Six cosmic chalk button examples labeled idle, loading, error, success, neutral, and danger.</desc>
  <defs>
    <filter id="chalk" x="-8%" y="-20%" width="116%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="9" result="dust" />
      <feDisplacementMap in="SourceGraphic" in2="dust" scale="1.5" />
      <feGaussianBlur stdDeviation=".15" />
    </filter>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="27" r=".8" fill="#f4ecd7" opacity=".08" />
      <circle cx="79" cy="68" r=".6" fill="#8fdcff" opacity=".08" />
      <path d="M45 9l7-.5M8 78l5 1" stroke="#f5d88c" opacity=".06" />
    </pattern>
    <style>
      .line { fill: none; stroke: #f4ecd7; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .comet { fill: none; stroke: #8fdcff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .52; }
      .copy { fill: #c8ccdb; font: 600 16px system-ui, sans-serif; }
      .label { fill: #aeb8c9; font: 600 10px ui-monospace, monospace; letter-spacing: 1.1px; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#080f20" />
  <rect width="1200" height="260" rx="24" fill="#10182b" />
  <rect width="1200" height="260" rx="24" fill="url(#grain)" />
  <g aria-hidden="true" opacity=".7">
    <circle cx="109" cy="32" r="1.2" fill="#8fdcff" />
    <circle cx="1014" cy="34" r="1" fill="#f5d88c" />
    <path d="M108 32L161 54M1013 34L1064 62" class="comet" />
  </g>
  <g filter="url(#chalk)">
    <text x="56" y="47" class="label" fill="#8fdcff">BUTTON STATES / COSMIC CHALK</text>
    <g transform="translate(56 76)">
      <path d="M1 2Q1-3 7-2H162Q168-2 168 3V53Q168 58 162 58H7Q1 58 1 52Z" fill="#f4ecd7" stroke="#f4ecd7" stroke-width="2.5" />
      <text x="30" y="34" fill="#10182b" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Save chart</text>
      <text x="38" y="84" class="label">IDLE</text>
    </g>
    <g transform="translate(252 76)">
      <path d="M1 3Q0-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" opacity=".56" />
      <text x="20" y="34" class="copy">Mapping…</text>
      <text x="49" y="84" class="label" fill="#f5d88c">LOADING</text>
    </g>
    <g transform="translate(448 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q168 58 162 58H7Q1 57 1 52Z" class="line" stroke="#ff9ba8" />
      <text x="47" y="34" class="copy" fill="#ff9ba8">Retry</text>
      <text x="62" y="84" class="label" fill="#ff9ba8">ERROR</text>
    </g>
    <g transform="translate(644 76)">
      <path d="M1 2Q1-3 7-2H162Q168-2 168 3V53Q168 58 162 58H7Q1 58 1 52Z" fill="#f4ecd7" stroke="#f4ecd7" stroke-width="2.5" />
      <text x="27" y="34" fill="#10182b" font-family="system-ui,sans-serif" font-size="15" font-weight="600">In orbit</text>
      <text x="51" y="84" class="label" fill="#93e6c0">SUCCESS</text>
    </g>
    <g transform="translate(840 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" opacity=".48" />
      <text x="29" y="34" class="copy" opacity=".82">Preview</text>
      <text x="55" y="84" class="label">NEUTRAL</text>
    </g>
    <g transform="translate(1036 76)">
      <path d="M1 3Q1-2 7-2H162Q168-1 168 4V53Q167 58 161 58H7Q1 57 1 52Z" class="line" stroke="#ff9ba8" />
      <text x="34" y="34" class="copy" fill="#ff9ba8">Delete</text>
      <text x="59" y="84" class="label" fill="#ff9ba8">DANGER</text>
    </g>
    <path d="M56 211Q205 207 355 211T650 211T945 211T1144 211" class="comet" opacity=".42" />
    <text x="56" y="235" class="label">IDLE · LOADING · ERROR · SUCCESS · NEUTRAL · DANGER</text>
  </g>
</svg>
